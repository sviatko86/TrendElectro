name: SEO pages and images
on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * *"
permissions:
  contents: write
concurrency:
  group: seo
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-save sharp@0.33.5
      - run: node seo.mjs
        env:
          MAXIMG: "600"
      - name: Commit changes
        run: |
          git config user.name "trend-electro-bot"
          git config user.email "bot@users.noreply.github.com"
          git add -A p c img sitemap.xml robots.txt
          if git diff --cached --quiet; then echo "Без змін"; else git commit -m "Автооновлення SEO-сторінок і фото" && git pull --rebase && git push; fi
