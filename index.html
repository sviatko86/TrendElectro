<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Trend Electro — електротовари та LED-освітлення</title>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;800&display=swap" rel="stylesheet">
<script defer src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script defer src="config.js"></script>
<style>
:root{--bg:#f1f2f3;--card:#fff;--ink:#1d2023;--mute:#62676d;--line:#dcdfe2;--acc:#0ABAB5;--accink:#1d2023;--nav:#1d2023;--navink:#fff;--ok:#1f8a4c;--bad:#c0392b;box-sizing:border-box}
@media (prefers-color-scheme:dark){:root{--bg:#121416;--card:#1b1e21;--ink:#eceef0;--mute:#9da3a9;--line:#2c3034;--nav:#0d0f10;--ok:#4cc27f;--bad:#ff6b5b}}
*{box-sizing:border-box}html{scroll-padding-top:70px}
body{margin:0;background:var(--bg);color:var(--ink);font:400 15px/1.5 Manrope,system-ui,-apple-system,Segoe UI,Roboto,sans-serif;-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}button{cursor:pointer}a{color:inherit}
.wrap{max-width:1180px;margin:0 auto;padding:0 14px}
header{background:var(--nav);color:var(--navink);position:sticky;top:0;z-index:20;padding-top:env(safe-area-inset-top,0px)}
.top{display:grid;grid-template-columns:1fr auto;grid-template-areas:"logo cart" "search search" "nav nav";gap:8px;padding:10px 0}
.logo{grid-area:logo;display:block}.logo img{display:block;height:44px;width:auto}
.cartbtn{grid-area:cart;align-self:center;background:var(--acc);color:#1d2023;border:0;border-radius:8px;padding:10px 14px;font-weight:800}
.search{grid-area:search}.search input{width:100%;padding:11px 12px;border-radius:8px;border:0;background:#fff;color:#1d2023}
.nav{grid-area:nav;display:flex;gap:8px}.nav button{flex:1;background:transparent;color:var(--navink);border:1px solid #3a4856;border-radius:8px;padding:9px 8px;font-weight:600;white-space:nowrap}
.nav button.cat{background:#2b3036;border-color:#4a525b}
@media (min-width:820px){.top{grid-template-columns:auto 1fr auto auto;grid-template-areas:"logo search nav cart";align-items:center;gap:12px}.nav button{flex:none;padding:10px 14px}}
.btn,.go{display:inline-block;border:0;background:var(--acc);color:#1d2023;border-radius:8px;padding:12px 20px;font-weight:800;text-decoration:none;text-align:center}
.hero{margin:16px 0;background:var(--nav);color:#fff;border-radius:8px;border-left:6px solid var(--acc);padding:26px 22px;display:grid;gap:8px;justify-items:start}.hero[hidden]{display:none}
.hero h1{margin:0;font-size:clamp(24px,5vw,38px);line-height:1.1;letter-spacing:-.5px;max-width:560px}.hero p{margin:0;color:#c3ccd5;max-width:480px}
.slider{position:relative;margin:16px 0;border-radius:8px;overflow:hidden;aspect-ratio:16/7;background:var(--nav)}.slider[hidden]{display:none}
@media (max-width:600px){.slider{aspect-ratio:4/3}}
.sl{position:absolute;inset:0;opacity:0;transition:opacity .5s;display:block;pointer-events:none}.sl.on{opacity:1;z-index:1;pointer-events:auto}
.sl img{width:100%;height:100%;object-fit:cover;display:block}
.slt{position:absolute;left:0;right:0;bottom:0;padding:36px 16px 16px;background:linear-gradient(transparent,rgba(0,0,0,.72));color:#fff}.slt b{font-size:20px;display:block}
.dots{position:absolute;bottom:8px;right:12px;display:flex;gap:6px;z-index:2}.dots button{width:10px;height:10px;border-radius:50%;border:0;padding:0;background:rgba(255,255,255,.55)}.dots button.on{background:var(--acc)}
.perks{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px;margin-bottom:18px}
.perks div{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:13px;color:var(--mute)}.perks b{display:block;color:var(--ink);font-size:14px}
.promos{display:grid;gap:8px;margin:0 0 16px}.promo{background:var(--card);border:1px solid var(--line);border-left:5px solid var(--acc);border-radius:8px;padding:10px 12px}.promo b{display:block}.promo small{color:var(--mute)}
h2{font-size:20px;margin:22px 0 10px}
.catlist{display:flex;flex-direction:column;background:var(--card);border:1px solid var(--line);border-radius:8px;overflow:hidden}
.crow{display:grid;grid-template-columns:56px 1fr auto auto;align-items:center;gap:12px;padding:10px 14px;border-bottom:1px solid var(--line);text-decoration:none}.crow:last-child{border-bottom:0}
.crow .th{width:56px;height:56px;background:#fff;border-radius:6px;position:relative;overflow:hidden}.crow .th img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:#fff}
.crow b{font-size:16px}.crow small{color:var(--mute)}.crow i{font-style:normal;font-size:22px;color:var(--mute)}
.crumbs{font-size:13px;color:var(--mute);margin:14px 0 6px}.crumbs a{color:var(--mute);text-decoration:none}.crumbs a:hover{color:var(--acc)}
.ptitle{font-size:24px;margin:4px 0 12px;line-height:1.2}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}.chip{background:var(--card);border:1px solid var(--line);border-radius:6px;padding:7px 12px;text-decoration:none;font-weight:600;font-size:14px}.chip small{color:var(--mute);font-weight:400}.chip:hover{border-color:var(--acc)}
.bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:8px 0 12px;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:10px}
.bar select,.bar input{padding:8px;border-radius:6px;border:1px solid var(--line);background:var(--bg);min-width:0}.bar input{width:92px}.bar .fnd{margin-left:auto;color:var(--mute);font-size:13px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(165px,1fr));gap:10px}
.card{background:var(--card);border:1px solid var(--line);border-radius:8px;display:flex;flex-direction:column;overflow:hidden;position:relative}
.pic{aspect-ratio:4/3;position:relative;background:#fff;display:block;overflow:hidden}.pic:before{content:"немає фото";position:absolute;inset:0;display:grid;place-items:center;color:#9aa0a6;font-size:12px}
.pic img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;padding:8px;background:#fff}
.bds{position:absolute;left:6px;top:6px;display:flex;flex-direction:column;gap:3px;align-items:flex-start;z-index:2}.bd{font-size:11px;font-weight:800;padding:2px 7px;border-radius:4px;color:#fff}.bd.h{background:#1f8a4c}.bd.n{background:#2b6cb0}.bd.s{background:#c0392b}
.fv{position:absolute;right:6px;top:6px;z-index:2;width:32px;height:32px;border-radius:50%;border:1px solid var(--line);background:rgba(255,255,255,.92);color:#1d2023;font-size:17px;line-height:1;padding:0}.fv.on{color:#c0392b}
.body{padding:10px;display:flex;flex-direction:column;gap:4px;flex:1}.name{font-weight:600;font-size:14px;line-height:1.3;text-decoration:none;display:block}
.sku{font-size:12px;color:var(--mute)}.stock{font-size:12px;color:var(--ok)}.stock.no{color:var(--bad)}
.price{margin-top:auto;font-size:18px;font-weight:800}.price s{font-size:13px;font-weight:400;color:var(--mute);margin-left:6px}
.add{border:0;background:var(--acc);color:#1d2023;border-radius:8px;padding:10px;font-weight:800}.add:disabled{opacity:.45;cursor:not-allowed}
.more{display:block;margin:16px auto;padding:11px 26px;border-radius:8px;border:1px solid var(--line);background:var(--card);font-weight:800}.more[hidden]{display:none}
.empty{padding:30px;text-align:center;color:var(--mute)}
.pgrid{display:grid;gap:16px;margin:8px 0 24px}@media (min-width:900px){.pgrid{grid-template-columns:minmax(0,1.05fr) minmax(0,1fr)}}
.pimg{background:#fff;border:1px solid var(--line);border-radius:10px;aspect-ratio:1/1;max-height:min(70vh,560px);width:100%;position:relative;overflow:hidden}@media (max-width:899px){.pimg{aspect-ratio:4/3;max-height:42vh}}body.pv .chat{display:none}.pimg:before{content:"немає фото";position:absolute;inset:0;display:grid;place-items:center;color:#9aa0a6}
.pimg img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;padding:14px;background:#fff}
.pinfo h1{font-size:22px;line-height:1.25;margin:0 0 12px}
.avail{display:flex;align-items:center;gap:8px;padding:10px 12px;background:var(--card);border:1px solid var(--line);border-radius:8px;font-weight:700;color:var(--ok)}.avail.no{color:var(--bad)}
.bigprice{font-size:32px;font-weight:800;margin:14px 0 4px}.bigprice s{font-size:16px;font-weight:400;color:var(--mute);margin-left:8px}
.buyrow{display:flex;gap:8px;margin:12px 0;flex-wrap:wrap}
.qtybox{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--card)}.qtybox button{width:42px;border:0;background:var(--bg);font-size:20px}.qtybox input{width:54px;text-align:center;border:0;background:transparent}
.buybtn{flex:1;min-width:140px;border:0;border-radius:8px;background:var(--acc);color:#1d2023;font-weight:800;font-size:16px;padding:12px}.buybtn:disabled{opacity:.5}
.favbtn{width:48px;border:1px solid var(--line);border-radius:8px;background:var(--card);font-size:20px}.favbtn.on{color:#c0392b}
.meta{display:grid;gap:6px;margin:12px 0}.meta div{padding:9px 12px;background:var(--card);border:1px solid var(--line);border-radius:8px;font-size:14px}.meta a{color:var(--acc);font-weight:700}
.icons{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:12px 0}.icons a{padding:12px;background:var(--card);border:1px solid var(--line);border-radius:8px;text-align:center;font-weight:600;text-decoration:none;font-size:14px}.icons a:hover{border-color:var(--acc)}
.box{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px;margin-bottom:14px}.box h3{margin:0 0 8px;font-size:16px}
.kv{display:flex;gap:8px;font-size:14px;padding:6px 0}.kv span:first-child{color:var(--mute);flex:0 1 46%}.kv span:last-child{flex:1;text-align:right}
.kv:not(:last-child){border-bottom:1px dotted var(--line)}
.tabsb{display:flex;gap:6px;margin-bottom:10px}.tabsb button{flex:1;padding:10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);font-weight:700}.tabsb button.on{background:var(--acc);color:#1d2023;border-color:var(--acc)}
.sp{width:100%;border-collapse:collapse;font-size:14px}.sp td{padding:8px 0;border-bottom:1px solid var(--line);vertical-align:top}.sp td:first-child{color:var(--mute);padding-right:10px;width:46%}
.txt p{margin:0 0 10px;line-height:1.6}.txt{font-size:15px}
footer{background:var(--nav);color:#c3ccd5;margin-top:30px;padding:24px 0 90px;font-size:14px}
footer .wrap{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:16px}footer b{color:#fff;display:block;margin-bottom:4px}footer a{display:block;text-decoration:none;padding:2px 0}footer img{width:200px;max-width:100%;height:auto;display:block;margin-bottom:8px}
.shade{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;z-index:30}.shade.on{display:block}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(420px,100%);background:var(--card);z-index:31;transform:translateX(100%);transition:transform .2s;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.drawer.left{right:auto;left:0;transform:translateX(-100%);width:min(440px,100%)}.drawer.on{transform:none}
.dh{display:flex;justify-content:space-between;align-items:center;padding:14px;border-bottom:1px solid var(--line);font-weight:800;font-size:17px}.dh button{border:0;background:none;font-size:24px}
.dl{flex:1;overflow:auto;padding:10px 14px;overscroll-behavior:contain}.dl.flush{padding:0}
.row{display:grid;grid-template-columns:1fr auto;gap:2px 8px;padding:10px 0;border-bottom:1px solid var(--line)}.row a{text-decoration:none}
.qty{display:flex;gap:6px;align-items:center}.qty button{width:28px;height:28px;border-radius:6px;border:1px solid var(--line);background:var(--bg)}
.df{padding:14px;border-top:1px solid var(--line);display:grid;gap:8px}.df[hidden]{display:none}
.df input,.df select,.ibox input{width:100%;padding:10px;border-radius:8px;border:1px solid var(--line);background:var(--bg)}
.total{display:flex;justify-content:space-between;font-weight:800;font-size:17px}
.done{padding:14px;display:grid;gap:8px}.done[hidden]{display:none}.done pre{white-space:pre-wrap;word-break:break-word;background:var(--bg);padding:10px;border-radius:8px;font:13px/1.4 inherit;margin:0}
.drawer.ordered .dl,.drawer.ordered .df{display:none}.drawer.ordered .done{flex:1;overflow:auto;align-content:start}
.msg{font-size:13px;color:var(--bad)}.msg.ok{color:var(--ok)}
.tabs{display:flex;gap:6px}.tabs button{flex:1;padding:9px;border:1px solid var(--line);border-radius:8px;background:var(--bg);font-weight:600}.tabs button.on{background:var(--acc);color:#1d2023;border-color:var(--acc)}
.bigcard{background:var(--nav);color:#fff;border-radius:10px;padding:16px;border-left:6px solid var(--acc);margin-bottom:12px}.bigcard b{font-size:22px;letter-spacing:1px;display:block}.bigcard small{color:#c3ccd5}
.ord{padding:8px 0;border-bottom:1px solid var(--line);font-size:14px;display:flex;justify-content:space-between;gap:8px}
.pcode{border:1px dashed var(--acc);border-radius:8px;padding:10px;margin-bottom:8px;display:flex;justify-content:space-between;gap:8px;align-items:center}.pcode b{font-size:17px;letter-spacing:1px}.pcode small{color:var(--mute);display:block}.pcode button{border:0;background:var(--acc);color:#1d2023;font-weight:800;border-radius:6px;padding:8px 12px}
.cm-row{display:flex;align-items:center;border-bottom:1px solid var(--line)}.cm-row a{flex:1;padding:14px 16px;font-weight:700;text-decoration:none}.cm-row a small{color:var(--mute);font-weight:400}.cm-row button{width:52px;align-self:stretch;border:0;background:none;font-size:22px;color:var(--acc)}
.cm-sub{display:none;background:var(--bg)}.cm-sub.open{display:block}.cm-sub .cm-row a{padding-left:30px;font-weight:600}.cm-sub .cm-sub .cm-row a{padding-left:46px;font-weight:500}
.chat{position:fixed;right:14px;bottom:calc(14px + env(safe-area-inset-bottom,0px));z-index:15;display:grid;gap:8px;justify-items:end}.chat[hidden]{display:none}
.chatb{background:var(--acc);color:#1d2023;border:0;border-radius:24px;padding:12px 18px;font-weight:800;box-shadow:0 4px 14px rgba(0,0,0,.3)}
.chatp{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:6px;display:grid;min-width:190px;box-shadow:0 6px 20px rgba(0,0,0,.25)}.chatp[hidden]{display:none}.chatp a{padding:11px 12px;text-decoration:none;font-weight:600;border-radius:6px}.chatp a:hover{background:var(--bg)}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}


</style>
</head>

<script>
const $=i=>document.getElementById(i);
const esc=t=>String(t==null?"":t).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const money=n=>{n=+n||0;return n.toLocaleString("uk-UA",{minimumFractionDigits:n%1?2:0,maximumFractionDigits:2})+" ₴"};
const LS=(k,d)=>{try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}};
const SV=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}};
const SEP=" › ",ORD=["Освітлення","Розетки і вимикачі","Кабелі та проводи електричні","Захист електромережі","Електромонтажне обладнання"];
const PDEF={delivery:["Оплата і доставка","Відправляємо замовлення по Україні Новою поштою (відділення або кур’єр) та Укрпоштою. Оплата при отриманні або за домовленістю з менеджером."],exchange:["Обмін та повернення","Умови обміну та повернення товару визначаються законодавством України. Для оформлення звернувся до менеджера за контактами внизу сторінки."],coop:["Співпраця","Пропонуємо оптові ціни та умови співпраці для електриків, монтажних організацій і магазинів. Зв’яжіться з нами будь-яким зручним способом."],about:["Про нас","Trend Electro — електротовари, LED-освітлення та електрофурнітура."],contacts:["Контакти","Зв’яжіться з нами телефоном або через месенджери."]};
PDEF.exchange[1]="Умови обміну та повернення товару визначаються законодавством України. Для оформлення зверніться до менеджера за контактами внизу сторінки.";
let P=[],M={},ROOT={kids:{},count:0,path:[]},PR={m:0,d:0,c:{}},CI={},PAGES={},sb=null,me=null,prof=null,promoPct=0,promoCode="",BN=[],bix=0,btm=null,tab="in",PROMOS=[];
let cart=LS("te_cart",{}),fav=LS("te_fav",{}),F={brand:"",min:"",max:"",sort:"def",q:"",lim:24},SCR={},CUR={path:[],list:[],key:null},PTAB="info",QTY=1;

/* ---------- зображення ---------- */
const thumb=(u,w,h)=>!u?"":u.indexOf(".supabase.co/")>-1?u:"https://wsrv.nl/?url="+encodeURIComponent(u)+"&w="+w+"&h="+(h||Math.round(w*.75))+"&fit=contain&output=webp&q=75";
function bad(im){if(!im.dataset.f){im.dataset.f=1;im.src=im.dataset.o}else im.style.display="none"}
const img=(u,w,h)=>u?`<img loading="lazy" decoding="async" src="${esc(thumb(u,w,h))}" data-o="${esc(u)}" alt="" onerror="bad(this)">`:"";

/* ---------- дерево категорій ---------- */
const href=path=>"#/c/"+path.map(encodeURIComponent).join("/");
function build(){
 ROOT={name:"",path:[],kids:{},count:0};
 P.forEach(p=>{let n=ROOT;n.count++;p.c.forEach((nm,i)=>{let k=n.kids[nm];if(!k)k=n.kids[nm]={name:nm,path:p.c.slice(0,i+1),kids:{},count:0};k.count++;if(!k.img&&p.img)k.img=p.img;n=k})});
}
function kids(n){
 const a=Object.keys(n.kids).map(k=>n.kids[k]);
 if(n===ROOT)a.sort((x,y)=>{const i=ORD.indexOf(x.name),j=ORD.indexOf(y.name);return(i<0?99:i)-(j<0?99:j)||y.count-x.count});
 else a.sort((x,y)=>y.count-x.count);
 return a;
}
function nodeAt(path){let n=ROOT;for(const k of path){n=n.kids[k];if(!n)return null}return n}
const nodeImg=n=>CI[n.path.join(SEP)]||n.img||"";

/* ---------- ціни: націнка/знижка за рівнями (найточніший рівень виграє) ---------- */
function rate(p){
 const k1=p.c[0],k2=p.c[1]?k1+SEP+p.c[1]:null,k3=p.c[2]?k2+SEP+p.c[2]:null;let m=null,d=null;
 [k3,k2,k1].forEach(k=>{const o=k&&PR.c[k];if(o){if(m==null&&o.m!=null)m=+o.m;if(d==null&&o.d!=null)d=+o.d}});
 return[m!=null?m:PR.m,d!=null?d:PR.d];
}
const price=p=>{const r=rate(p);return Math.round(p.pr0*(1+r[0]/100)*(1-r[1]/100)*100)/100};
function oldPrice(p){const r=rate(p);if(r[1]>0)return Math.round(p.pr0*(1+r[0]/100)*100)/100;if(p.old>p.pr0)return Math.round(p.old*(1+r[0]/100)*100)/100;return 0}
const oldHtml=p=>{const o=oldPrice(p);return o?`<s>${money(o)}</s>`:""};

/* ---------- картка товару ---------- */
function card(p){
 const out=!p.st,o=oldPrice(p),pc=price(p),disc=o?Math.round((1-pc/o)*100):0;
 const b=(p.hit?'<span class="bd h">Хіт</span>':"")+(p.nw?'<span class="bd n">Новинка</span>':"")+(disc>0?`<span class="bd s">−${disc}%</span>`:"");
 return `<article class="card"><a class="pic" href="#/p/${encodeURIComponent(p.id)}">${img(p.img,360)}${b?`<div class="bds">${b}</div>`:""}</a><button class="fv${fav[p.id]?" on":""}" data-f="${esc(p.id)}" aria-label="Обране">${fav[p.id]?"♥":"♡"}</button><div class="body"><a class="name" href="#/p/${encodeURIComponent(p.id)}">${esc(p.n)}</a><div class="sku">Арт. ${esc(p.id)}</div>${out?'<div class="stock no">Немає в наявності</div>':'<div class="stock">В наявності</div>'}<div class="price">${money(pc)}${oldHtml(p)}</div><button class="add" data-a="${esc(p.id)}"${out?" disabled":""}>${out?"Немає":"У кошик"}</button></div></article>`;
}

/* ---------- дані ---------- */
async function loadProducts(){
 const all=[];let from=0;const step=1000;

   if(r.error){m(r.error.message.indexOf("already")>-1?"Цей email уже зареєстровано. Увійдіть.":"Не вдалося зареєструватися: "+r.error.message);return}
   if(!r.data.session)m("Перевірте пошту й підтвердіть email, потім увійдіть.",true);
  }else{
   const r=await sb.auth.signInWithPassword({email:em,password:pw});t.disabled=false;
   if(r.error){m(r.error.message==="Invalid login credentials"?"Невірний email або пароль.":"Помилка: "+r.error.message);return}
  }
 }
 if(t.id==="rsave"){const u=await sb.from("profiles").update({full_name:$("rn").value.trim(),phone:$("rp").value.trim()}).eq("id",me.id);if(u.error){m("Не вдалося зберегти.");return}m("Збережено ✓",true);setTimeout(loadProf,0)}
 if(t.id==="rout"){await sb.auth.signOut();me=null;prof=null;promoPct=0;promoCode="";$("accBtn").textContent="Увійти";drawCart();drawAcc()}
}

/* ---------- чат і контакти ---------- */
function initChat(){
 const T=window.TE||{},c=T.chat||{},l=[];
 if(c.telegram)l.push(["Telegram","https://t.me/"+String(c.telegram).replace(/^@/,"")]);
 if(c.viber)l.push(["Viber","viber://chat?number="+encodeURIComponent("+"+String(c.viber).replace(/\D/g,""))]);
 if(c.whatsapp)l.push(["WhatsApp","https://wa.me/"+String(c.whatsapp).replace(/\D/g,"")+"?text="+encodeURIComponent("Доброго дня! Маю питання щодо товару.")]);
 const fc=[];if(T.phone)fc.push(esc(T.phone));if(T.email)fc.push(esc(T.email));if(T.hours)fc.push(esc(T.hours));
 if(fc.length)$("fcont").innerHTML="<b>Контакти</b>"+fc.join("<br>");
 if(!l.length)return;
 $("chatp").innerHTML=l.map(x=>`<a href="${esc(x[1])}" target="_blank" rel="noopener">${x[0]}</a>`).join("");$("chat").hidden=false;
 $("chatb").onclick=e=>{e.stopPropagation();$("chatp").hidden=!$("chatp").hidden};
 document.addEventListener("click",e=>{if(!e.target.closest("#chat"))$("chatp").hidden=true});
}

/* ---------- події ---------- */
let tmr=null;const later=f=>{clearTimeout(tmr);tmr=setTimeout(f,200)};
document.addEventListener("click",e=>{
 const a=e.target.closest("a[href^='#/']");
 if(a){const h=a.getAttribute("href");if(h.indexOf("#/c/")===0&&!a.dataset.brand){F.q="";$("q").value="";SCR[h]=0}
  if(a.dataset.brand){e.preventDefault();F={brand:a.dataset.brand,min:"",max:"",sort:"def",q:"",lim:24};CUR.key="";if((location.hash||"")==="#/c/")route();else location.hash="#/c/";return}
  if(h.indexOf("#/p/")===0)SCR[location.hash||"#/"]=window.scrollY;
  return;}
 const t=e.target.closest("button");if(!t)return;const d=t.dataset;
 if(d.a){cart[d.a]=(cart[d.a]||0)+1;save();drawCart();const o=t.textContent;t.textContent="Додано ✓";setTimeout(()=>t.textContent=o,900);return}
 if(d.f){const id=d.f;if(fav[id])delete fav[id];else fav[id]=1;SV("te_fav",fav);document.querySelectorAll(`[data-f="${CSS.escape(id)}"]`).forEach(b=>{b.classList.toggle("on",!!fav[id]);b.textContent=fav[id]?"♥":"♡"});drawCart();if((location.hash||"")==="#/fav")viewFav();return}
 if(d.p){cart[d.p]++;save();drawCart();return}
 if(d.m){cart[d.m]--;if(cart[d.m]<1)delete cart[d.m];save();drawCart();return}
 if(d.q){const i=$("pq");i.value=Math.max(1,Math.min(999,(+i.value||1)+(+d.q)));return}
 if(t.id==="buy"){const n=Math.max(1,Math.min(999,+$("pq").value||1)),id=t.dataset.id;cart[id]=(cart[id]||0)+n;save();drawCart();t.textContent="Додано ✓";setTimeout(()=>t.textContent="Купити",900);return}
 if(d.pt){PTAB=d.pt;document.querySelectorAll(".tabsb button").forEach(b=>b.classList.toggle("on",b===t));const id=decodeURIComponent(location.hash.slice(4));if(M[id])drawDet(M[id]);return}
 if(d.b!==undefined){showB(+d.b);return}
 if(d.tg!==undefined){const s=t.parentNode.nextElementSibling;if(s){s.classList.toggle("open");t.textContent=s.classList.contains("open")?"−":"+"}return}
 if(t.id==="more"){const from=F.lim;F.lim+=24;$("grid").insertAdjacentHTML("beforeend",CUR.list.slice(from,F.lim).map(card).join(""));moreBtn();return}
 if(t.id==="dclose"){panel("drawer",false);return}
 if(t.id==="catBtn"){openCatMenu();return}
 if(t.id==="favBtn"){location.hash="#/fav";return}
 if(t.id==="accBtn"){drawAcc();panel("acc",true);return}
 if(t.id==="cartBtn"){openCart();return}
 if(t.id==="close"){panel("drawer",false);return}
 if(t.id==="aclose"){panel("acc",false);return}
 if(t.id==="cclose"){panel("catm",false);return}
 if(t.id==="order"){placeOrder(t);return}
 if(t.closest("#abody")){accClick(t);return}
});
document.addEventListener("input",e=>{
 const i=e.target;
 if(i.id==="q"){F.q=i.value.trim();F.lim=24;later(()=>{if((location.hash||"").indexOf("#/c")!==0){CUR.key="\u0002";location.hash="#/c/"}else renderGrid()})}
 if(i.id==="fmin"||i.id==="fmax"){F.min=$("fmin").value;F.max=$("fmax").value;F.lim=24;later(renderGrid)}
});
document.addEventListener("change",e=>{
 const i=e.target;
 if(i.id==="fbrand"){F.brand=i.value;F.lim=24;renderGrid()}
 if(i.id==="fsort"){F.sort=i.value;F.lim=24;renderGrid()}
 if(i.id==="fpr")applyPromo(i.value);
});
$("shade").onclick=closeAll;
window.addEventListener("hashchange",()=>{route()});

/* ---------- запуск ---------- */
async function boot(){
 $("view").innerHTML='<div class="empty">Завантаження каталогу…</div>';drawCart();
 if(!(window.supabase&&window.TE&&TE.url&&TE.key)){$("view").innerHTML='<div class="empty">Каталог тимчасово недоступний.</div>';return}
 initChat();
 sb=supabase.createClient(TE.url,TE.key);
 sb.auth.onAuthStateChange((_e,s)=>{me=s?s.user:null;setTimeout(loadProf,0)});
 loadBanners();loadPromos();
 try{await Promise.all([loadProducts(),loadSettings()])}catch(e){$("view").innerHTML='<div class="empty">Не вдалося завантажити каталог. Оновіть сторінку.</div>';return}
 try{const g=await sb.auth.getSession();me=g.data.session?g.data.session.user:null;await loadProf()}catch(e){}
 route();
}
document.addEventListener("DOMContentLoaded",boot);

</script>
