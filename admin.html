function tImport(){
 $("pane").innerHTML=`<div class="box"><h2>Імпорт прайсу</h2><p class="mut">Excel/CSV. Колонки (назви можуть відрізнятись): Артикул, Назва, Ціна, Бренд, Фото, Опис, Характеристики та категорія: або одна колонка «Розділ» (Група › Підгрупа › Під-підгрупа, розділювач › або / або >), або окремі колонки «Група», «Підгрупа», «Під-підгрупа».</p><input id="xf" type="file" accept=".xlsx,.xls,.csv"><div><label>Що зробити</label><select id="xm"><option value="full">Повний імпорт: додати нові й оновити наявні</option><option value="prices">Оновити лише ціни наявних товарів</option><option value="cats">Оновити лише категорії наявних товарів (за артикулом)</option></select></div><div class="msg" id="fm"></div><button data-act="doimport">Імпортувати</button><p class="mut">Повний імпорт не змінює позначки Хіт/Новинка, стару ціну, приховування й наявність. Товари, яких немає у файлі, не видаляються.</p></div>`;
}
const plain=h=>{if(h==null||h==="")return null;const t=(new DOMParser().parseFromString(String(h),"text/html").body.textContent||"").replace(/\s+/g," ").trim();return t?t.slice(0,3000):null};
function splitPath(s){
 s=String(s||"").trim();if(!s)return[];
 const sep=s.indexOf("›")>-1?"›":s.indexOf(">")>-1?">":"/";
 let a=s.split(sep).map(x=>x.trim()).filter(Boolean);
 if(a.length>3)a=[a[0],a[1],a.slice(2).join(" / ")];return a;
}
const A={id:["артикул","код","sku","код товару"],name:["назва","найменування","назва товару"],price:["ціна","price"],brand:["бренд","виробник"],img:["фото","зображення","image","картинка"],desc:["опис"],specs:["характеристики (повні)","характеристики"],path:["розділ","шлях категорії"],c1:["група","категорія"],c2:["підгрупа","підкатегорія"],c3:["під-підгрупа","підпідгрупа","підпідкатегорія"]};
function prod(r){
 const R={};Object.keys(r).forEach(k=>R[String(k).trim().toLowerCase()]=r[k]);
 const g=n=>{for(const k of A[n])if(R[k]!==undefined&&R[k]!=="")return R[k];return""};
 let path=splitPath(g("path"));if(!path.length)path=[g("c1"),g("c2"),g("c3")].map(x=>String(x).trim()).filter(Boolean);
 const pc=String(g("price")).trim()===""?NaN:Number(String(g("price")).replace(",","."));
 return{id:String(g("id")).trim(),name:String(g("name")).trim(),path,brand:g("brand")?String(g("brand")).trim():null,price:pc,image_url:g("img")?String(g("img")).trim():null,description:plain(g("desc")),specs:g("specs")?String(g("specs")).slice(0,3000):null};
}
async function doImport(){
 const fl=$("xf").files[0];if(!fl)return flash("Оберіть файл.");
 if(typeof XLSX==="undefined")return flash("Бібліотека читання Excel ще не завантажилась. Зачекайте секунду й спробуйте знову.");
 flash("Читаю файл…",true);
 try{
  const wb=XLSX.read(await fl.arrayBuffer(),{type:"array"});
  const ws=wb.Sheets["Імпорт"]||wb.Sheets[wb.SheetNames[0]];
  const rows=XLSX.utils.sheet_to_json(ws,{defval:""});
  const mode0=$("xm").value;const map={};rows.map(prod).forEach(x=>{if(x.id&&x.name&&(mode0==="cats"||isFinite(x.price)))map[x.id]=x});
  const items=Object.keys(map).map(k=>map[k]);if(!items.length)return flash("У файлі не знайдено товарів. Перевірте назви колонок.");
  const mode=$("xm").value,hasPath=items.some(x=>x.path.length);let done=0;
  if(mode==="cats"&&!hasPath)return flash("У файлі немає колонок категорій.");
  const size=mode==="full"?200:500;
  for(let i=0;i<items.length;i+=size){
   const ch=items.slice(i,i+size);
   if(mode==="prices"){const u=await sb.rpc("bulk_update_prices",{items:ch.map(x=>({id:x.id,price:x.price}))});if(u.error)throw u.error;done+=u.data||0}
   else if(mode==="cats"){const u=await sb.rpc("bulk_set_categories",{items:ch.filter(x=>x.path.length).map(x=>({id:x.id,c1:x.path[0],c2:x.path[1]||"",c3:x.path[2]||""}))});if(u.error)throw u.error;done+=u.data||0}
   else{const up=await sb.from("products").upsert(ch.map(x=>{const o={id:x.id,name:x.name,brand:x.brand,price:x.price,image_url:x.image_url,description:x.description,specs:x.specs};if(!x.image_url)delete o.image_url;if(!x.brand)delete o.brand;if(!x.description)delete o.description;if(!x.specs)delete o.specs;if(hasPath){o.category=x.path[0]||"Інше";o.subcategory=x.path[1]||null;o.subcategory2=x.path[2]||null}return o}),{onConflict:"id"});if(up.error)throw up.error;done+=ch.length}
   flash("Оброблено "+Math.min(i+size,items.length)+" з "+items.length+"…",true);
  }
  TREE=[];flash(mode==="prices"?`Готово ✓ Оновлено цін: ${done} (з ${items.length} у файлі).`:mode==="cats"?`Готово ✓ Оновлено категорій: ${done}.`:`Готово ✓ Імпортовано товарів: ${done}.`,true);
 }catch(er){flash("Помилка: "+(er.message||er))}
}

function shrink(file,max,q){return new Promise((res,rej)=>{const im=new Image(),u=URL.createObjectURL(file);im.onload=()=>{const s=Math.min(1,max/Math.max(im.width,im.height)),c=document.createElement("canvas");c.width=Math.round(im.width*s);c.height=Math.round(im.height*s);c.getContext("2d").drawImage(im,0,0,c.width,c.height);URL.revokeObjectURL(u);c.toBlob(b=>b?res(b):rej(new Error("Не вдалося стиснути фото")),"image/jpeg",q)};im.onerror=()=>rej(new Error("Не вдалося прочитати фото"));im.src=u})}
const pathOf=u=>{const k=u.indexOf("/site/");return k>-1?u.slice(k+6):null};
async function putImage(file,max,folder){
 const blob=await shrink(file,max,0.82),path=folder+"/"+Date.now()+".jpg";
 const u=await sb.storage.from("site").upload(path,blob,{contentType:"image/jpeg"});if(u.error)throw u.error;
 return sb.storage.from("site").getPublicUrl(path).data.publicUrl;
}

 }

 if(a==="delcode"){if(confirm("Видалити код?")){await sb.from("promo_codes").delete().eq("code",t.dataset.id);tCodes()}return}
 if(a==="setdisc"){
  const v=num(document.querySelector(`[data-cdisc="${t.dataset.id}"]`).value)||0;
  r=await sb.rpc("admin_set_discount",{uid:t.dataset.id,pct:v});return flash(r.error?"Помилка: "+r.error.message:"Знижку збережено ✓",!r.error);
 }
 if(a==="pcode"){
  const pct=parseFloat(prompt("Знижка за персональним промокодом для цього клієнта, %:","10"));if(!pct)return;
  const code=genCode(8);r=await sb.from("promo_codes").insert({code,percent:pct,uses_left:1,client_id:t.dataset.id,title:"Персональна знижка"});
  return flash(r.error?"Помилка: "+r.error.message:`Код ${code} (−${pct}%, одноразовий). Клієнт бачить його у своєму кабінеті.`,!r.error);
 }
 /* банери */
 if(a==="addbanner"){
  const fl=$("bf").files[0];if(!fl)return flash("Оберіть фото.");flash("Завантаження…",true);
  try{const url=await putImage(fl,1600,"banners"),mx=BNS.reduce((m,b)=>Math.max(m,b.sort),0);
   const ib=await sb.from("banners").insert({image_url:url,title:$("bt").value.trim()||null,subtitle:$("bs").value.trim()||null,link:$("bl").value.trim()||null,sort:mx+1,...($("bsd").value?{starts_at:$("bsd").value+"T00:00:00"}:{}),...($("bed").value?{ends_at:$("bed").value+"T23:59:59"}:{})});
   if(ib.error)throw ib.error;return tBanners()}catch(er){return flash("Помилка: "+(er.message||er))}
 }
 if(a==="bup"||a==="bdown"){const i=+t.dataset.i,j=a==="bup"?i-1:i+1;if(j<0||j>=BNS.length)return;const A=BNS[i],B=BNS[j];await sb.from("banners").update({sort:B.sort}).eq("id",A.id);await sb.from("banners").update({sort:A.sort}).eq("id",B.id);return tBanners()}
 if(a==="togb"){await sb.from("banners").update({active:t.dataset.v!=="true"}).eq("id",t.dataset.id);return tBanners()}
 if(a==="delb"){if(confirm("Видалити банер?")){await sb.from("banners").delete().eq("id",t.dataset.id);const bp=pathOf(t.dataset.u||"");if(bp)await sb.storage.from("site").remove([bp]);tBanners()}return}
 if(a==="savepages"){
  const v={};document.querySelectorAll("[data-pt]").forEach(i=>{const k=i.dataset.pt;v[k]=v[k]||{};v[k][i.dataset.pf]=i.value.trim()}); 
  r=await sb.from("settings").upsert({key:"pages",value:v,updated_at:new Date().toISOString()});
  return flash(r.error?"Помилка: "+r.error.message:"Збережено ✓",!r.error);
 }
});
init();

</script>
</body>
</html>
