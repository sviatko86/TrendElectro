<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Адмінка — Trend Electro</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script defer src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="config.js"></script>
<style>
:root{--bg:#f1f2f3;--card:#fff;--ink:#1d2023;--mute:#62676d;--line:#dcdfe2;--acc:#0ABAB5;--nav:#1d2023;--bad:#c0392b;--ok:#1f8a4c}
@media (prefers-color-scheme:dark){:root{--bg:#121416;--card:#1b1e21;--ink:#eceef0;--mute:#9da3a9;--line:#2c3034;--nav:#0d0f10;--bad:#ff6b5b;--ok:#4cc27f}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
header{background:var(--nav);color:#fff;padding:12px 14px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:5}
main{max-width:900px;margin:0 auto;padding:12px}
button,input,select,textarea{font:inherit;color:inherit}
input,select,textarea{width:100%;padding:10px;border:1px solid var(--line);border-radius:8px;background:var(--card)}
button{cursor:pointer;border:0;border-radius:8px;padding:10px 14px;background:var(--acc);color:#1d2023;font-weight:700}button:disabled{opacity:.5}
button.sec{background:var(--card);color:var(--ink);border:1px solid var(--line)}a.btn2{display:inline-block;padding:9px 12px;border-radius:8px;background:var(--acc);color:#1d2023;font-weight:700;text-decoration:none;font-size:14px}button.del{background:transparent;color:var(--bad);border:1px solid var(--bad)}
.subt{display:flex;gap:6px;overflow-x:auto;margin-bottom:12px}.subt button{background:var(--card);color:var(--ink);border:1px solid var(--line);white-space:nowrap;padding:6px 12px;font-size:13px;border-radius:999px}.subt button.on{background:#0ABAB5;color:#fff;border-color:#0ABAB5}
.tabs{display:flex;gap:6px;overflow-x:auto;margin-bottom:12px;position:sticky;top:var(--hh,52px);z-index:4;background:var(--bg,#f4f6f8);padding:8px 0;scrollbar-width:thin}.tabs button{background:var(--card);color:var(--ink);border:1px solid var(--line);white-space:nowrap}.tabs button.on{background:var(--acc);color:#1d2023;border-color:var(--acc)}
.box.onew{background:rgba(10,186,181,.15);border-color:rgba(10,186,181,.45);animation:onp 2.6s ease-in-out infinite}@keyframes onp{0%,100%{background:rgba(10,186,181,.05)}50%{background:rgba(10,186,181,.15)}}@media(prefers-reduced-motion:reduce){.box.onew{animation:none}}
.box{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px;margin-bottom:10px;display:grid;gap:8px}
.rw{display:flex;justify-content:space-between;gap:8px;align-items:center;flex-wrap:wrap}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
@media (max-width:560px){.grid3{grid-template-columns:1fr}}
.mut{color:var(--mute);font-size:13px}.msg{font-size:14px}.msg.bad{color:var(--bad)}.msg.ok{color:var(--ok)}
label{font-size:13px;color:var(--mute);display:block;margin-bottom:3px}h2{margin:6px 0 4px;font-size:18px}
.nd{background:var(--card);border:1px solid var(--line);border-radius:8px;margin-bottom:6px;padding:0 10px}.nd summary{padding:10px 0;cursor:pointer}.ndb{display:grid;gap:6px;padding:0 0 10px 8px;border-left:3px solid var(--acc);margin-left:2px}
.psrch{display:grid;grid-template-columns:1fr auto auto;gap:8px}@media (max-width:600px){.psrch{grid-template-columns:1fr 1fr}.psrch input{grid-column:1/-1}}
.pfl{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}.chip2{background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:999px;padding:7px 12px;font-weight:600;font-size:13px;white-space:nowrap}.chip2.on{background:var(--acc);border-color:var(--acc);color:#1d2023}
.ck{display:flex;gap:8px;align-items:center;margin:0;color:var(--ink);font-size:14px}.ck input{width:auto}.selall{margin:4px 2px 8px}
.prow{display:grid;grid-template-columns:auto 48px 1fr auto;gap:10px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 10px;margin-bottom:6px}.prow input{width:auto}.prow img{width:48px;height:48px;object-fit:contain;background:#fff;border-radius:6px}
.pinf{min-width:0;display:grid;gap:2px;cursor:pointer}.pinf b{font-size:14px;line-height:1.3;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}.pinf .mut{font-size:12px}.pinf s{opacity:.7}
.tgs{display:flex;flex-wrap:wrap;gap:4px}.tg{font-style:normal;font-size:11px;font-weight:700;padding:2px 7px;border-radius:999px;color:#fff;background:#888}.tg.h{background:#15191c}.tg.n{background:#2f6fd6}.tg.p{background:#8a1fe0}.tg.s{background:#e23b1c}.tg.g{background:#9aa0a6}
.pact{position:sticky;bottom:0;z-index:5;background:var(--card);border:2px solid var(--line);border-radius:12px;padding:10px;margin-top:10px;display:grid;gap:8px;box-shadow:0 -6px 20px rgba(0,0,0,.08)}.pact[hidden]{display:none}.pact.on{border-color:var(--acc)}.pact .psrch{grid-template-columns:1fr auto}.pager{margin:6px 0}
@media (max-width:600px){.prow{grid-template-columns:auto 44px 1fr 14px}.prow>button{display:none}.prow:after{content:"›";font-size:22px;color:var(--mute)}.prow img{width:44px;height:44px}}
.pact:not(.on) .psrch,.pact:not(.on) #pax{display:none}.pact:not(.on){box-shadow:none;padding:8px 10px}
.tbl{width:100%;border-collapse:collapse}.tbl td,.tbl th{padding:8px;border-bottom:1px solid var(--line);text-align:left;font-size:14px}
.pwf{position:relative;display:block;width:100%}.pwf input{padding-right:46px!important;width:100%;box-sizing:border-box}.pwe{position:absolute;right:4px;top:50%;transform:translateY(-50%);width:40px;height:40px;border:0;background:none;color:#6b7780;cursor:pointer;display:grid;place-items:center;border-radius:50%;padding:0}.pwe:hover{color:#0ABAB5}
</style>
</head>
<body>
<header><b>Trend Electro · Адмінка</b><button class="sec" id="out" hidden>Вийти</button></header>
<main id="app"><p>Завантаження…</p></main>
<script>
const $=i=>document.getElementById(i);
const esc=t=>String(t==null?"":t).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const money=n=>Number(n).toLocaleString("uk-UA",{maximumFractionDigits:2})+" ₴";
const num=v=>v===""||v==null?null:Number(v);
const SEP=" › ",ST={new:"Нове",confirmed:"Підтверджено",shipped:"Відправлено",done:"Виконано",cancelled:"Скасовано"};
const AL="ABCDEFGHJKMNPQRSTUVWXYZ23456789";
const genCode=(n=8)=>{const a=new Uint32Array(n);crypto.getRandomValues(a);let s="";a.forEach(x=>s+=AL[x%AL.length]);return s};
const sb=supabase.createClient(TE.url,TE.key);
let cur="dash",OL=[],OQ={q:"",st:"",days:0},TREE=[],CI={},CM={},BNS=[],clients=[],PQ={q:"",cat:"",f:"",page:0,total:0};
async function init(){
 const s=await sb.auth.getSession();if(!s.data.session)return login();
 const p=await sb.from("profiles").select("is_admin").eq("id",s.data.session.user.id).maybeSingle();
 if(!p.data||!p.data.is_admin){$("app").innerHTML='<div class="box"><h2>Немає доступу</h2><p class="mut">Цей акаунт не має прав адміністратора.</p><button id="x">Вийти</button></div>';$("x").onclick=logout;return}
 $("out").hidden=false;shell();
}
function login(msg){
 $("app").innerHTML=`<div class="box" style="max-width:380px;margin:30px auto"><h2>Вхід для адміністратора</h2><input id="le" type="email" placeholder="Email" autocomplete="email"><input id="lp" type="password" placeholder="Пароль" autocomplete="current-password"><div class="msg bad" id="lm">${esc(msg||"")}</div><button id="lg">Увійти</button></div>`;
 $("lg").onclick=async()=>{const r=await sb.auth.signInWithPassword({email:$("le").value.trim(),password:$("lp").value});if(r.error)return login(r.error.message==="Invalid login credentials"?"Невірний email або пароль, або акаунт ще не створено.":"Помилка: "+r.error.message);init()};
}
async function logout(){await sb.auth.signOut();$("out").hidden=true;login()}
$("out").onclick=logout;
const T={dash:"Огляд",orders:"Замовлення",products:"Товари",cats:"Категорії",price:"Ціни",clients:"Клієнти",mkt:"Маркетинг",shop:"Налаштування"};
const GR={mkt:{promos:"Акції",codes:"Промокоди",banners:"Банери",leads:"Підписники",bdays:"Іменинники",land:"Лендінги",loy:"Картки"},shop:{shop:"Магазин",pages:"Сторінки",import:"Імпорт",backup:"Резервна копія"}};
const SUB={mkt:"promos",shop:"shop"},LEAFG={};Object.keys(GR).forEach(g=>Object.keys(GR[g]).forEach(k=>LEAFG[k]=g));
const setCur=k=>{if(LEAFG[k]&&k!=="shop"){SUB[LEAFG[k]]=k;cur=LEAFG[k]}else cur=k};
function shell(){
 document.documentElement.style.setProperty("--hh",document.querySelector("header").offsetHeight+"px");
 const tb=document.querySelector(".tabs");
 if(tb){tb.querySelectorAll("button").forEach(b=>b.classList.toggle("on",b.dataset.tab===cur));const a=tb.querySelector(".on");if(a)a.scrollIntoView({block:"nearest",inline:"nearest"});$("pane").innerHTML="";window.scrollTo(0,0)}
 else{ $("app").innerHTML='<div class="tabs">'+Object.keys(T).map(k=>`<button data-tab="${k}" class="${k===cur?"on":""}">${T[k]}</button>`).join("")+'</div><div id="subt"></div><div id="pane"></div>';
  const a=document.querySelector('.tabs .on');if(a)a.scrollIntoView({block:'nearest',inline:'center'})}
 const g=GR[cur],leaf=g?SUB[cur]:cur;
 $("subt").innerHTML=g?'<div class="subt">'+Object.keys(g).map(k=>`<button data-sub="${k}" class="${k===leaf?"on":""}">${g[k]}</button>`).join("")+'</div>':"";
 ({dash:tDash,orders:tOrders,products:tProducts,cats:tCats,import:tImport,price:tPrice,promos:tPromos,bdays:tBdays,land:tLand,loy:tLoy,codes:tCodes,clients:tClients,leads:tLeads,banners:tBanners,pages:tPages,shop:tShop,backup:tBackup})[leaf]();
}
const fail=e=>{$("pane").innerHTML=`<div class="box"><div class="msg bad">Помилка: ${esc(e.message||e)}</div></div>`};
const flash=(t,ok)=>{const m=$("fm");if(m){m.className="msg "+(ok?"ok":"bad");m.textContent=t}};


const SITE="https://sviatko86.github.io/TrendElectro/";
let LAST=null;
const normPhone=p=>{let d=String(p||"").replace(/\D/g,"");if(d.length===10&&d[0]==="0")d="38"+d;if(d.length===9)d="380"+d;return d};
const msgText=(code,pct,exp)=>`Вітаємо! Ваш промокод ${code} — знижка ${pct}%.${exp?" Діє до "+new Date(exp).toLocaleDateString("uk-UA")+".":""} Оформіть замовлення на сайті: ${SITE}`;
function shareRow(name,phone,code,pct,exp){
 const text=msgText(code,pct,exp),e=encodeURIComponent(text),p=normPhone(phone);
 const wa=p?`https://wa.me/${p}?text=${e}`:`https://wa.me/?text=${e}`;
 const vb=p?`viber://chat?number=%2B${p}`:`viber://forward?text=${e}`;
 const tg=`https://t.me/share/url?url=${encodeURIComponent(SITE)}&text=${e}`;
 const sm=p?`sms:+${p}?body=${e}`:`sms:?body=${e}`;
 return `<div class="box"><div class="rw"><b>${esc(name||"Усі клієнти")}</b><span class="mut">${esc(phone||"")} · <b>${esc(code)}</b> · −${pct}%</span></div><div class="rw" style="justify-content:flex-start"><a class="btn2" href="${wa}" target="_blank" rel="noopener">WhatsApp</a><a class="btn2" href="${vb}">Viber</a><a class="btn2" href="${tg}" target="_blank" rel="noopener">Telegram</a><a class="btn2" href="${sm}">SMS</a><button class="sec" data-act="copy" data-t="${encodeURIComponent(text)}">Копіювати текст</button></div></div>`;
}
function renderShare(rows,pct,exp){
 const byId={};clients.forEach(c=>byId[c.id]=c);
 $("mres").innerHTML=`<h2>Надіслати клієнтам</h2><p class="mut">Кнопка відкриває чат або SMS з готовим текстом. Надсилаєте одним натиском, без автоматичної розсилки в месенджери.</p>`+rows.map(r=>{const c=r.client_id?byId[r.client_id]:null;return shareRow(c?c.full_name:"Усі клієнти",c?c.phone:"",r.code,pct,exp)}).join("");
}

/* ---------- дерево категорій ---------- */
async function loadTree(){
 const cnt={};let from=0;
 for(;;){const r=await sb.from("products").select("category,subcategory,subcategory2").range(from,from+999);if(r.error)throw r.error;
  r.data.forEach(x=>{const k=[x.category,x.subcategory,x.subcategory2].filter(Boolean).join(SEP);cnt[k]=(cnt[k]||0)+1});
  if(r.data.length<1000)break;from+=1000}
 TREE=Object.keys(cnt).map(k=>({p:k.split(SEP),n:cnt[k]}));
}
function treeModel(){const root={kids:{},n:0,path:[]};TREE.forEach(t=>{let node=root;node.n+=t.n;t.p.forEach((nm,i)=>{const k=node.kids[nm]||(node.kids[nm]={name:nm,path:t.p.slice(0,i+1),kids:{},n:0});k.n+=t.n;node=k})});return root}
const sk=n=>Object.keys(n.kids).map(k=>n.kids[k]).sort((a,b)=>b.n-a.n);
const lvlNames=i=>[...new Set(TREE.map(t=>t.p[i]).filter(Boolean))].sort((a,b)=>a.localeCompare(b,"uk"));
const dl=(id,a)=>`<datalist id="${id}">${a.map(x=>`<option value="${esc(x)}">`).join("")}</datalist>`;
const pathInputs=(p)=>`<div class="grid3"><div><label>Група</label><input id="${p}1" list="dl1">${dl("dl1",lvlNames(0))}</div><div><label>Підгрупа</label><input id="${p}2" list="dl2">${dl("dl2",lvlNames(1))}</div><div><label>Під-підгрупа</label><input id="${p}3" list="dl3">${dl("dl3",lvlNames(2))}</div></div>`;
const readPath=p=>[$(p+"1").value.trim(),$(p+"2").value.trim(),$(p+"3").value.trim()].filter(Boolean);

/* ---------- замовлення ---------- */
const dstr=d=>new Date(d).toLocaleDateString("uk-UA",{day:"2-digit",month:"2-digit"});
const EVL={created:"Замовлення створено",status:"Статус:",ttn:"ТТН:",note:"Примітка:"};
async function tDash(){
 const since=new Date(Date.now()-60*864e5).toISOString();
 const r=await sb.from("orders").select("id,created_at,total,status,items").gte("created_at",since).order("created_at",{ascending:false}).limit(2000);if(r.error)return fail(r.error);
 const cnt=async f=>{const q=await f(sb.from("products").select("id",{count:"exact",head:true}));return q.count||0};
 const [nAll,nHid,nNoImg,nOut]=await Promise.all([cnt(q=>q),cnt(q=>q.eq("active",false)),cnt(q=>q.eq("active",true).or("image_url.is.null,image_url.eq.")),cnt(q=>q.eq("active",true).eq("in_stock",false))]);
 const O=r.data,ok=O.filter(o=>o.status!=="cancelled"),now=Date.now(),day=864e5;
 const sum=a=>a.reduce((m,o)=>m+(+o.total||0),0),per=d=>ok.filter(o=>now-new Date(o.created_at)<d*day);
 const t0=new Date();t0.setHours(0,0,0,0);const today=ok.filter(o=>new Date(o.created_at)>=t0),w=per(7),m=per(30);
 const newN=O.filter(o=>o.status==="new").length,avg=m.length?sum(m)/m.length:0;
 const days=[];for(let k=13;k>=0;k--){const d0=new Date();d0.setHours(0,0,0,0);d0.setDate(d0.getDate()-k);const d1=new Date(d0);d1.setDate(d1.getDate()+1);const a=ok.filter(o=>{const t=new Date(o.created_at);return t>=d0&&t<d1});days.push({d:d0,s:sum(a),n:a.length})}
 const mx=Math.max(1,...days.map(x=>x.s));
 const top={};m.forEach(o=>(o.items||[]).forEach(i=>{const k=i.id;top[k]=top[k]||{n:i.name,q:0,s:0};top[k].q+=+i.qty||0;top[k].s+=(+i.price||0)*(+i.qty||0)}));
 const tl=Object.keys(top).map(k=>[k,top[k]]).sort((a,b)=>b[1].q-a[1].q).slice(0,6);
 const card=(l,v,sub,go)=>`<div class="box" style="margin:0;${go?"cursor:pointer":""}" ${go?`data-go="${go}"`:""}><div class="mut">${l}</div><div style="font-size:26px;font-weight:800;margin:2px 0">${v}</div><div class="mut">${sub||""}</div></div>`;
 $("pane").innerHTML=`<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px;margin-bottom:12px">${card("Нові замовлення",newN,newN?"потребують обробки":"усе опрацьовано","orders")}${card("Сьогодні",money(sum(today)),plural(today.length))}${card("7 днів",money(sum(w)),plural(w.length))}${card("30 днів",money(sum(m)),plural(m.length)+" · середній чек "+money(avg))}</div>
<div class="box"><h2>Продажі за 14 днів</h2><div style="display:flex;gap:4px;align-items:flex-end;height:120px">${days.map(x=>`<div title="${dstr(x.d)}: ${money(x.s)}, замовлень ${x.n}" style="flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%"><div style="width:100%;background:var(--acc);border-radius:4px 4px 0 0;height:${Math.max(x.s?4:1,Math.round(x.s/mx*100))}%;opacity:${x.s?1:.25}"></div></div>`).join("")}</div><div class="rw mut" style="margin-top:4px"><span>${dstr(days[0].d)}</span><span>${dstr(days[13].d)}</span></div></div>
<div class="box"><h2>Що потребує уваги</h2>
<div class="rw"><span>Без фото (активні)</span><b>${nNoImg}</b></div><div class="rw"><span>Немає в наявності</span><b>${nOut}</b></div><div class="rw"><span>Приховані товари</span><b>${nHid}</b></div><div class="rw"><span>Усього товарів</span><b>${nAll}</b></div></div>
<div class="box"><h2>Топ товарів за 30 днів</h2>${tl.length?tl.map(x=>`<div class="rw"><span style="min-width:0"><b>${esc(x[1].n)}</b><span class="mut" style="display:block">${esc(x[0])}</span></span><span>${x[1].q} шт. · ${money(x[1].s)}</span></div>`).join(""):'<div class="mut">Поки що немає замовлень.</div>'}</div>`;
}
const plural=n=>n+" "+(n%10===1&&n%100!==11?"замовлення":n%10>=2&&n%10<=4&&(n%100<12||n%100>14)?"замовлення":"замовлень");
const oLine=o=>`<details class="box${o.status==="new"?" onew":""}" data-oid="${o.id}"><summary style="cursor:pointer"><b>№${o.id}</b> · ${esc(o.customer_name)} · <b>${money(o.total)}</b> · <span class="mut">${ST[o.status]||o.status} · ${new Date(o.created_at).toLocaleString("uk-UA",{day:"2-digit",month:"2-digit",hour:"2-digit",minute:"2-digit"})}${o.ttn?" · ТТН "+esc(o.ttn):""}</span></summary>
<div style="margin-top:8px"><div><a href="tel:${esc(o.phone)}"><b>${esc(o.phone)}</b></a></div><div class="mut">${esc(o.delivery||"")} · ${esc(o.address||"")} · ${esc(o.payment||"")}${o.promo_code?" · код "+esc(o.promo_code):""}</div>${o.comment?`<div class="mut">Коментар клієнта: ${esc(o.comment)}</div>`:""}
<div style="margin:8px 0">${(o.items||[]).map(i=>`<div class="mut">${esc(i.id)} · ${esc(i.name)} × ${i.qty} = ${money(i.price*i.qty)}</div>`).join("")}</div>
<div class="grid2"><div><label>Статус</label><select data-o="${o.id}">${Object.keys(ST).map(k=>`<option value="${k}"${o.status===k?" selected":""}>${ST[k]}</option>`).join("")}</select></div><div><label>Оплата</label><select data-opay="${o.id}"><option value="unpaid"${o.payment_status!=="paid"?" selected":""}>Не оплачено</option><option value="paid"${o.payment_status==="paid"?" selected":""}>Оплачено</option></select></div><div><label>ТТН (накладна)</label><input data-ottn="${o.id}" value="${esc(o.ttn||"")}" placeholder="20450000000000"></div></div>
<div><label>Внутрішня примітка (клієнт не бачить)</label><input data-onote="${o.id}" value="${esc(o.manager_note||"")}"></div>
<div class="rw"><span><button data-act="osave" data-id="${o.id}">Зберегти</button> <button class="sec" data-act="ohist" data-id="${o.id}">Історія</button></span><button class="sec" data-act="oprint" data-id="${o.id}">Друк</button></div><div id="oh${o.id}"></div></div></details>`;
function drawOrders(){
 const q=OQ.q.toLowerCase().trim(),since=OQ.days?Date.now()-OQ.days*864e5:0;

async function allRows(tb,cols){const out=[];let f=0;for(;;){const r=await sb.from(tb).select(cols).range(f,f+999);if(r.error)throw r.error;out.push(...r.data);if(r.data.length<1000)break;f+=1000}return out}
async function doBackup(btn){

 try{

 }catch(e){flash("Помилка: "+(e.message||e))}

function tImport(){
 $("pane").innerHTML=`<div class="box"><h2>Імпорт прайсу</h2><p class="mut">Excel/CSV. Колонки (назви можуть відрізнятись): Артикул, Назва, Ціна, <b>Залишок</b> (необов’язково; для бухт ціна в файлі — за 1 м, сайт сам множить на довжину бухти), Бренд, Фото, Опис, Характеристики та категорія: або одна колонка «Розділ» (Група › Підгрупа › Під-підгрупа, розділювач › або / або >), або окремі колонки «Група», «Підгрупа», «Під-підгрупа».</p><input id="xf" type="file" accept=".xlsx,.xls,.csv"><div><label>Що зробити</label><select id="xm"><option value="full">Повний імпорт: додати нові й оновити наявні</option><option value="prices">Оновити лише ціни наявних товарів</option><option value="cats">Оновити лише категорії наявних товарів (за артикулом)</option></select></div><div class="msg" id="fm"></div><button data-act="doimport">Імпортувати</button><p class="mut">Повний імпорт не змінює позначки Хіт/Новинка, стару ціну, приховування й наявність. Товари, яких немає у файлі, не видаляються.</p></div>`;
}
const plain=h=>{if(h==null||h==="")return null;const t=(new DOMParser().parseFromString(String(h),"text/html").body.textContent||"").replace(/\s+/g," ").trim();return t?t.slice(0,3000):null};
function splitPath(s){
 s=String(s||"").trim();if(!s)return[];
 const sep=s.indexOf("›")>-1?"›":s.indexOf(">")>-1?">":"/";
 let a=s.split(sep).map(x=>x.trim()).filter(Boolean);
 if(a.length>3)a=[a[0],a[1],a.slice(2).join(" / ")];return a;
}
const A={stock:["залишок","залишки","кількість","stock","наявність"],id:["артикул","код","sku","код товару"],name:["назва","найменування","назва товару"],price:["ціна","price"],brand:["бренд","виробник"],img:["фото","зображення","image","картинка"],desc:["опис"],specs:["характеристики (повні)","характеристики"],path:["розділ","шлях категорії"],c1:["група","категорія"],c2:["підгрупа","підкатегорія"],c3:["під-підгрупа","підпідгрупа","підпідкатегорія"]};
function prod(r){
 const R={};Object.keys(r).forEach(k=>R[String(k).trim().toLowerCase()]=r[k]);
 const g=n=>{for(const k of A[n])if(R[k]!==undefined&&R[k]!=="")return R[k];return""};
 let path=splitPath(g("path"));if(!path.length)path=[g("c1"),g("c2"),g("c3")].map(x=>String(x).trim()).filter(Boolean);
 const pc=String(g("price")).trim()===""?NaN:Number(String(g("price")).replace(",","."));
 const sk=String(g("stock")).trim()===""?null:Math.max(0,Math.floor(Number(String(g("stock")).replace(",","."))));return{stock:Number.isFinite(sk)?sk:null,id:String(g("id")).trim(),name:String(g("name")).trim(),path,brand:g("brand")?String(g("brand")).trim():null,price:pc,image_url:g("img")?String(g("img")).trim():null,description:plain(g("desc")),specs:g("specs")?String(g("specs")).slice(0,3000):null};
}
async function doImport(){
 const fl=$("xf").files[0];if(!fl)return flash("Оберіть файл.");
 if(typeof XLSX==="undefined")return flash("Бібліотека читання Excel ще не завантажилась. Зачекайте секунду й спробуйте знову.");
 flash("Читаю файл…",true);
 try{
  const wb=XLSX.read(await fl.arrayBuffer(),{type:"array"});
  const ws=wb.Sheets["Імпорт"]||wb.Sheets[wb.SheetNames[0]];
  const rows=XLSX.utils.sheet_to_json(ws,{defval:""});
  const mode0=$("xm").value;const map={};rows.map(prod).forEach(x=>{if(x.id&&x.name&&(mode0==="cats"||isFinite(x.price)))map[x.id]=x});
  const items=Object.keys(map).map(k=>map[k]);if(!items.length)return flash("У файлі не знайдено товарів. Перевірте назви колонок.");
  const mode=$("xm").value,hasPath=items.some(x=>x.path.length);let done=0;
  if(mode==="cats"&&!hasPath)return flash("У файлі немає колонок категорій.");
  const MN={full:"повний імпорт (створює й оновлює товари)",prices:"лише оновлення цін",cats:"лише зміна категорій"};
  const zero=mode==="cats"?0:items.filter(x=>!(x.price>0)).length;
  if(!confirm(`Режим: ${MN[mode]}.\nТоварів у файлі: ${items.length}.${zero?`\nУВАГА: у ${zero} товарів ціна 0 або порожня!`:""}\n\nПеред великим імпортом раджу зробити резервну копію (вкладка «Резервна копія»). Продовжити?`))return flash("Імпорт скасовано.");
  const size=mode==="full"?200:500;
  for(let i=0;i<items.length;i+=size){
   const ch=items.slice(i,i+size);
   if(mode==="prices"){const u=await sb.rpc("bulk_update_prices",{items:ch.map(x=>({id:x.id,price:x.price}))});if(u.error)throw u.error;done+=u.data||0}
   else if(mode==="cats"){const u=await sb.rpc("bulk_set_categories",{items:ch.filter(x=>x.path.length).map(x=>({id:x.id,c1:x.path[0],c2:x.path[1]||"",c3:x.path[2]||""}))});if(u.error)throw u.error;done+=u.data||0}
   else{const pq={};try{const pr=await sb.from("products").select("id,pack_qty").in("id",ch.map(x=>x.id));(pr.data||[]).forEach(r=>{if(+r.pack_qty>0)pq[r.id]=+r.pack_qty})}catch(e){}const up=await sb.from("products").upsert(ch.map(x=>{const o={id:x.id,name:x.name,brand:x.brand,price:x.price*(pq[x.id]||1),image_url:x.image_url,description:x.description,specs:x.specs};if(x.stock!=null){o.stock=x.stock;o.in_stock=x.stock>0}if(!x.image_url)delete o.image_url;if(!x.brand)delete o.brand;if(!x.description)delete o.description;if(!x.specs)delete o.specs;if(hasPath){o.category=x.path[0]||"Інше";o.subcategory=x.path[1]||null;o.subcategory2=x.path[2]||null}return o}),{onConflict:"id"});if(up.error)throw up.error;done+=ch.length}
   flash("Оброблено "+Math.min(i+size,items.length)+" з "+items.length+"…",true);
  }
  TREE=[];flash(mode==="prices"?`Готово ✓ Оновлено цін: ${done} (з ${items.length} у файлі).`:mode==="cats"?`Готово ✓ Оновлено категорій: ${done}.`:`Готово ✓ Імпортовано товарів: ${done}.`,true);
 }catch(er){flash("Помилка: "+(er.message||er))}
}

function shrink(file,max,q){return new Promise((res,rej)=>{const im=new Image(),u=URL.createObjectURL(file);im.onload=()=>{const s=Math.min(1,max/Math.max(im.width,im.height)),c=document.createElement("canvas");c.width=Math.round(im.width*s);c.height=Math.round(im.height*s);c.getContext("2d").drawImage(im,0,0,c.width,c.height);URL.revokeObjectURL(u);c.toBlob(b=>b?res(b):rej(new Error("Не вдалося стиснути фото")),"image/jpeg",q)};im.onerror=()=>rej(new Error("Не вдалося прочитати фото"));im.src=u})}
const pathOf=u=>{const k=u.indexOf("/site/");return k>-1?u.slice(k+6):null};
async function putImage(file,max,folder){
 const blob=await shrink(file,max,0.82),path=folder+"/"+Date.now()+".jpg";
 const u=await sb.storage.from("site").upload(path,blob,{contentType:"image/jpeg"});if(u.error)throw u.error;
 return sb.storage.from("site").getPublicUrl(path).data.publicUrl;
}

 $("cl").innerHTML=`<div class="mut" style="margin-bottom:6px">Покупців: <b>${L.length}</b> (без скасованих замовлень). Сортування за сумою покупок.</div>`+(L.length?L.slice(0,300).map(b=>{const p=normPhone(b.phone);return`<div class="box"><div class="rw"><b>${esc(b.name||"Без імені")}</b><span class="mut">${reg.has(b.k)?"✅ має кабінет":"без кабінету"}</span></div><div class="mut">${esc(b.phone)} · замовлень: <b>${b.n}</b> · сума: <b>${money(b.sum)}</b> · остання: ${new Date(b.last).toLocaleDateString("uk-UA")}</div>${Object.keys(b.src).length?`<div class="mut">Звідки: ${esc(Object.keys(b.src).slice(0,3).join("; "))}</div>`:""}<div class="rw" style="justify-content:flex-start"><a class="btn2" href="tel:+${p}">Подзвонити</a><a class="btn2" href="viber://chat?number=%2B${p}">Viber</a></div></div>`}).join(""):'<div class="box mut">Замовлень ще немає.</div>')}
function drawSources(){const ch={},lp={};let tot=0;
 ORD.filter(okOrd).forEach(o=>{const s=o.source||"не визначено (до підключення)",parts=s.split(" → лендінг "),c=parts[0],v=+o.total||0;tot++;(ch[c]=ch[c]||{n:0,s:0}).n++;ch[c].s+=v;if(parts[1]){(lp[parts[1]]=lp[parts[1]]||{n:0,s:0}).n++;lp[parts[1]].s+=v}});
 const T=(t,m)=>`<div class="box"><h3>${t}</h3>${Object.keys(m).length?`<table style="width:100%;border-collapse:collapse;font-size:14px"><tr><th align=left>Назва</th><th align=right>Замовлень</th><th align=right>Сума</th><th align=right>Сер. чек</th></tr>${Object.keys(m).sort((a,b)=>m[b].s-m[a].s).map(k=>`<tr style="border-top:1px solid var(--line)"><td>${esc(k)}</td><td align=right>${m[k].n}</td><td align=right>${money(m[k].s)}</td><td align=right>${money(Math.round(m[k].s/m[k].n))}</td></tr>`).join("")}</table>`:'<div class="mut">Поки порожньо.</div>'}</div>`;
 $("cl").innerHTML=`<div class="mut" style="margin-bottom:6px">Звідки приходять замовлення (без скасованих, усього ${tot}). Джерело записується для нових замовлень після оновлення сайту.</div>`+T("Канали",ch)+T("Лендінги",lp)}
document.addEventListener("click",async e=>{const t=e.target.closest("[data-cm]");if(!t)return;CMODE=t.dataset.cm;document.querySelectorAll("[data-cm]").forEach(b=>b.classList.toggle("on",b===t));$("cs").style.display=CMODE==="src"?"none":"";$("bdf").closest("label").style.display=CMODE==="reg"?"":"none";
 if(CMODE==="reg"){drawClients($("cs").value);return}$("cl").innerHTML='<div class="mut">Завантаження…</div>';try{await loadAllOrders()}catch(er){return fail(er)}CMODE==="buy"?drawBuyers($("cs").value):drawSources()});

/* ---------- картки клієнтів ---------- */
const LDEF={on:true,one:true,tiers:[{k:"silver",p:5,f:0},{k:"gold",p:10,f:5000},{k:"platinum",p:15,f:15000},{k:"vip",p:20,f:50000}]};
const LTN={silver:"Silver",gold:"Gold",platinum:"Platinum",vip:"VIP (діамантова)"};
async function tLoy(){const r=await sb.from("settings").select("value").eq("key","loyalty").maybeSingle();if(r.error)return fail(r.error);const v=(r.data&&r.data.value)||{},C={on:v.on!==false,one:v.one!==false,tiers:Array.isArray(v.tiers)&&v.tiers.length===4?v.tiers:LDEF.tiers};
 $("pane").innerHTML=`<div class="box"><h2>Картки клієнтів</h2><p class="mut">Кожен зареєстрований клієнт отримує картку Silver. Рівень росте автоматично від суми <b>виконаних</b> замовлень (статус «Виконано»). Знижка застосовується до всіх товарів сайту.</p><label><input type="checkbox" id="lyon" ${C.on?"checked":""} style="width:auto"> <b>Картки й знижки за ними увімкнені</b></label><label><input type="checkbox" id="lyone" ${C.one?"checked":""} style="width:auto"> <b>Разова знижка за велике замовлення</b> (замовлення на суму порогу дає знижку цього рівня одразу, навіть без картки)</label>
 <table style="width:100%;border-collapse:collapse"><tr><th align=left>Картка</th><th>Знижка, %</th><th>Від суми, ₴</th></tr>${C.tiers.map((t,i)=>`<tr><td>${LTN[t.k]}</td><td><input type="number" min="0" max="90" data-ly="p${i}" value="${t.p}"></td><td><input type="number" min="0" data-ly="f${i}" value="${t.f}" ${i===0?"disabled":""}></td></tr>`).join("")}</table>
 <button id="lysave">Зберегти</button><div class="msg" id="fm"></div><p class="mut">Після зміни порогів натисніть «Зберегти»: картки всіх клієнтів перерахуються автоматично. Покупки поза сайтом (магазин, готівка) додаються в «Клієнти → Зареєстровані» кнопкою «Додати покупки».</p></div>`}
document.addEventListener("click",async e=>{if(e.target.id!=="lysave")return;const g=n=>+document.querySelector(`[data-ly="${n}"]`).value||0,ks=["silver","gold","platinum","vip"],tiers=ks.map((k,i)=>({k,p:Math.min(90,Math.max(0,g("p"+i))),f:i?Math.max(0,g("f"+i)):0}));
 for(let i=1;i<4;i++)if(tiers[i].f<=tiers[i-1].f||tiers[i].p<tiers[i-1].p)return flash("Кожна наступна картка має вищий поріг і не меншу знижку.");
 const r=await sb.from("settings").upsert({key:"loyalty",value:{on:$("lyon").checked,one:$("lyone").checked,tiers},updated_at:new Date().toISOString()});if(r.error)return flash("Помилка: "+r.error.message);
 const q=await sb.rpc("admin_loy_recalc_all");flash(q.error?"Збережено, але перерахунок не вдався: "+q.error.message:"Збережено ✓ Картки "+q.data+" клієнтів перераховано. Оновіть сайт (Ctrl+F5).",!q.error)});
document.addEventListener("click",async e=>{const t=e.target.closest("[data-lgift]");if(!t)return;const c=clients.find(x=>x.id===t.dataset.lgift);const v=prompt("Яку картку подарувати клієнту «"+(c&&c.full_name||"")+"»?\n1 — Silver 5%\n2 — Gold 10%\n3 — Platinum 15%\n4 — VIP 20%\n0 — забрати подарунок\n\nВведіть цифру:","4");if(v===null)return;const m={"0":"","1":"silver","2":"gold","3":"platinum","4":"vip"}[String(v).trim()];if(m===undefined)return flash("Введіть цифру від 0 до 4");const r=await sb.rpc("admin_set_card_gift",{p_id:t.dataset.lgift,p_tier:m});if(r.error)return flash("Помилка: "+r.error.message);flash(m?"Картку подаровано 🎁":"Подарунок забрано");tClients()});
document.addEventListener("click",async e=>{const t=e.target.closest("[data-ladj]");if(!t)return;const c=clients.find(x=>x.id===t.dataset.ladj);const v=prompt("Скільки гривень покупок поза сайтом врахувати для картки клієнта «"+(c&&c.full_name||"")+"»? Зараз: "+(+(c&&c.loyalty_adj)||0),String(+(c&&c.loyalty_adj)||0));if(v===null)return;const n=Math.max(0,parseFloat(String(v).replace(",","."))||0);const r=await sb.rpc("admin_set_loyalty_adj",{p_id:t.dataset.ladj,p_adj:n});if(r.error)return flash("Помилка: "+r.error.message);tClients()});

/* показати / сховати пароль */
(function(){const E='<svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7S1 12 1 12z"/><circle cx="12" cy="12" r="3"/></svg>',X='<svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.9 17.9A10.9 10.9 0 0 1 12 19C5 19 1 12 1 12a19 19 0 0 1 5.1-5.9M9.9 4.2A10.7 10.7 0 0 1 12 4c7 0 11 8 11 8a19 19 0 0 1-3.2 4.2M14.1 14.1a3 3 0 1 1-4.2-4.2"/><path d="M1 1l22 22"/></svg>';
 function wrap(i){if(i.dataset.eye)return;i.dataset.eye=1;const w=document.createElement("div");w.className="pwf";i.parentNode.insertBefore(w,i);w.appendChild(i);const b=document.createElement("button");b.type="button";b.className="pwe";b.setAttribute("aria-label","Показати пароль");b.innerHTML=E;b.addEventListener("click",e=>{e.preventDefault();e.stopPropagation();const show=i.type==="password";i.type=show?"text":"password";b.innerHTML=show?X:E;b.setAttribute("aria-label",show?"Сховати пароль":"Показати пароль");i.focus()});w.appendChild(b)}
 const scan=()=>document.querySelectorAll('input[type="password"]').forEach(wrap);
 new MutationObserver(scan).observe(document.documentElement,{childList:true,subtree:true});scan()})();
</script>
